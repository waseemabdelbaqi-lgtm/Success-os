<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ريل صف 1 رياضيات — العد حتى ثلاثة</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Noto Sans Arabic", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #eef2ea, #d7e0d4 45%, #f7f3ea);
      color: #222a30;
    }
    main {
      width: min(420px, 92vw);
      background: rgba(255,255,255,.88);
      border-radius: 28px;
      padding: 18px 18px 22px;
      box-shadow: 0 18px 50px rgba(40,60,50,.12);
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; text-align: center; }
    p { margin: 0 0 14px; text-align: center; color: #4a7062; font-size: .92rem; }
    video {
      width: 100%; border-radius: 22px; background: #1c2622;
      aspect-ratio: 9/16; object-fit: cover;
    }
    .meta { margin-top: 12px; font-size: .82rem; text-align: center; color: #5a6660; }
  </style>
</head>
<body>
  <main>
    <h1>العدّ حتى ثلاثة</h1>
    <p>الصف 1 · الرياضيات · المعلمة سارة</p>
    <video controls playsinline poster="poster.jpg"
      src="jordan-g1-math-count-to-three-reel.mp4"></video>
    <div class="meta">SUCCESS OS · المنهاج الوطني الأردني · ريل 9:16</div>
  </main>
</body>
</html>

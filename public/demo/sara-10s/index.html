<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sara · 10s Success OS Studio Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4efe6;
        --muted: #c9c0b0;
        --accent: #d4a574;
        --studio: #0b1220;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #05080f;
        color: var(--ink);
        font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: min(100vw, 1100px);
        aspect-ratio: 16 / 9;
        margin: min(4vh, 32px) auto;
        overflow: hidden;
        border-radius: 0;
        background:
          radial-gradient(ellipse at 50% 20%, #1a2740 0%, transparent 55%),
          linear-gradient(180deg, #10182a 0%, #070b14 70%);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      }
      .wall {
        position: absolute;
        inset: 8% 6% 18%;
        background: linear-gradient(180deg, #0d1f3d, #10284d);
        border: 1px solid rgba(120, 170, 255, 0.25);
        box-shadow: inset 0 0 80px rgba(40, 110, 220, 0.25);
      }
      .board {
        position: absolute;
        right: 10%;
        top: 18%;
        width: 34%;
        height: 42%;
        background: #12325c;
        border: 8px solid #2a1d14;
        box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      }
      .board::after {
        content: "Success OS";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(18px, 3vw, 34px);
        color: rgba(244, 239, 230, 0.88);
        letter-spacing: 0.04em;
      }
      .floor {
        position: absolute;
        left: 0; right: 0; bottom: 0; height: 28%;
        background: linear-gradient(180deg, #1a140f, #0d0a08);
      }
      .light {
        position: absolute;
        width: 40%;
        height: 50%;
        top: 0;
        left: 15%;
        background: radial-gradient(circle, rgba(255, 220, 170, 0.22), transparent 70%);
        pointer-events: none;
        animation: breathLight 3.2s ease-in-out infinite;
      }
      .rim {
        position: absolute;
        width: 30%;
        height: 40%;
        top: 10%;
        left: 0;
        background: radial-gradient(circle, rgba(160, 190, 255, 0.18), transparent 70%);
        pointer-events: none;
      }
      .teacher {
        position: absolute;
        bottom: 6%;
        left: 8%;
        width: 38%;
        height: 78%;
        background-position: center bottom;
        background-size: contain;
        background-repeat: no-repeat;
        filter: drop-shadow(0 18px 28px rgba(0,0,0,0.5));
        transform-origin: 50% 100%;
        opacity: 0;
      }
      .face {
        position: absolute;
        width: 16%;
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        left: 19%;
        top: 14%;
        border: 2px solid rgba(255,255,255,0.15);
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        opacity: 0;
        background: #222 center/cover no-repeat;
      }
      .caption {
        position: absolute;
        left: 4%;
        right: 4%;
        bottom: 3%;
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        z-index: 5;
      }
      .brand {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(22px, 3.5vw, 40px);
        letter-spacing: -0.02em;
        text-shadow: 0 2px 16px rgba(0,0,0,0.6);
      }
      .line {
        max-width: 55%;
        text-align: right;
        font-size: clamp(13px, 1.7vw, 18px);
        color: var(--muted);
        line-height: 1.45;
        min-height: 2.8em;
      }
      .hud {
        width: min(100vw, 1100px);
        margin: 0 auto 40px;
        padding: 0 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 14px;
      }
      button {
        appearance: none;
        border: 1px solid rgba(212, 165, 116, 0.55);
        background: linear-gradient(180deg, #3a2a1c, #241810);
        color: var(--ink);
        padding: 10px 18px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      .timer {
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      .note { opacity: 0.85; max-width: 52ch; }
      /* Timeline: 10s total */
      .run .teacher {
        animation:
          enter 1.4s ease-out forwards,
          walk 2.2s ease-in-out 5.2s forwards,
          breathe 2.8s ease-in-out 1.4s 3;
      }
      .run .face {
        animation:
          faceIn 1s ease-out 0.9s forwards,
          smile 0.8s ease-out 2.1s forwards,
          lookCam 2s ease-in-out 1.6s 2;
      }
      .run .cam {
        animation: camMove 10s ease-in-out forwards;
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 35% 40%;
      }
      @keyframes enter {
        0% { opacity: 0; transform: translateX(-18%) scale(0.96); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
      }
      @keyframes walk {
        0% { transform: translateX(0); }
        100% { transform: translateX(14%); }
      }
      @keyframes breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-1.2%) scale(1.008); }
      }
      @keyframes faceIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes smile {
        from { filter: saturate(0.95) brightness(0.98); }
        to { filter: saturate(1.08) brightness(1.05); }
      }
      @keyframes lookCam {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2%); }
      }
      @keyframes camMove {
        0% { transform: scale(1.08) translate(2%, 1%); }
        35% { transform: scale(1.02) translate(0, 0); }
        70% { transform: scale(1.06) translate(-1%, -1%); }
        100% { transform: scale(1) translate(0, 0); }
      }
      @keyframes breathLight {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @media (max-width: 700px) {
        .stage { aspect-ratio: 9 / 14; margin-top: 12px; }
        .teacher { width: 70%; left: 15%; height: 70%; }
        .face { width: 28%; left: 36%; top: 12%; }
        .board { width: 48%; height: 28%; top: 12%; right: 8%; }
        .line { max-width: 100%; text-align: left; }
        .caption { flex-direction: column; align-items: start; }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="cam" id="cam">
        <div class="wall"></div>
        <div class="board"></div>
        <div class="floor"></div>
        <div class="light"></div>
        <div class="rim"></div>
        <div
          class="teacher"
          id="teacher"
          style="background-image: url('../../media/ai-teachers/sara/classroom/stand.png')"
        ></div>
        <div
          class="face"
          id="face"
          style="background-image: url('../../media/ai-teachers/sara/portrait.png')"
        ></div>
      </div>
      <div class="caption">
        <div class="brand">Sara</div>
        <div class="line" id="line">Tap Play for the 10-second studio entrance.</div>
      </div>
    </div>

    <div class="hud">
      <div>
        <button type="button" id="play">Play 10s Demo</button>
        <span class="timer" id="timer">0.0s / 10.0s</span>
      </div>
      <p class="note">
        Original digital teacher · technique-only reference from Success4SureCenter ·
        not a likeness of any real person. Photorealism recovery still below ≥95 —
        this public surface is for owner dual-acceptance review.
      </p>
    </div>

    <audio id="voice" preload="auto" src="../../media/ai-teachers/sara/demo/welcome-success-os.mp3"></audio>

    <script>
      const DURATION = 10000;
      const CLOSING =
        "Welcome to Success OS. I'm Sara, and I'll be your teacher.";
      const beats = [
        [0, "Sara enters the Success OS studio."],
        [1400, "She looks naturally toward the camera."],
        [2400, "A natural smile — warm, professional."],
        [3400, "Greeting the student."],
        [4200, CLOSING],
        [7800, "Natural walk · breath · blink · studio lighting."],
        [9600, CLOSING],
      ];
      const stage = document.getElementById("stage");
      const teacher = document.getElementById("teacher");
      const line = document.getElementById("line");
      const timer = document.getElementById("timer");
      const play = document.getElementById("play");
      const voice = document.getElementById("voice");
      let raf = 0;
      let start = 0;

      function setPose(name) {
        teacher.style.backgroundImage =
          "url('../../media/ai-teachers/sara/classroom/" + name + ".png')";
      }

      function tick(now) {
        const t = Math.min(DURATION, now - start);
        timer.textContent = (t / 1000).toFixed(1) + "s / 10.0s";
        let text = beats[0][1];
        for (const [ms, msg] of beats) {
          if (t >= ms) text = msg;
        }
        line.textContent = text;
        if (t >= 5200 && t < 7800) setPose("point");
        else if (t >= 7800) setPose("stand");
        if (t < DURATION) raf = requestAnimationFrame(tick);
        else {
          stage.classList.remove("run");
          play.disabled = false;
          play.textContent = "Replay 10s Demo";
        }
      }

      async function startDemo() {
        cancelAnimationFrame(raf);
        play.disabled = true;
        play.textContent = "Playing…";
        setPose("stand");
        stage.classList.remove("run");
        void stage.offsetWidth;
        stage.classList.add("run");
        start = performance.now();
        try {
          voice.currentTime = 0;
          // Speak during introduce beat
          setTimeout(() => { void voice.play().catch(() => {}); }, 3800);
        } catch (_) {}
        raf = requestAnimationFrame(tick);
      }

      play.addEventListener("click", startDemo);
      // Auto-start for public / shared links
      window.addEventListener("load", () => {
        setTimeout(startDemo, 400);
      });
    </script>
  </body>
</html>

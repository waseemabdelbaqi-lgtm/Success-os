name: Deploy Preview Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  preview-note:
    name: Preview deployment note
    runs-on: ubuntu-latest

    steps:
      - name: Comment Vercel preview instructions
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              '## Vercel Preview',
              '',
              'This repository is configured for Vercel deployment.',
              '',
              '1. Connect the repo in the [Vercel dashboard](https://vercel.com/new).',
              '2. Configure environment variables from `.env.example`.',
              '3. Vercel will automatically create preview deployments for pull requests.',
              '',
              'See `docs/deployment.md` for the full production checklist.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes('## Vercel Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
